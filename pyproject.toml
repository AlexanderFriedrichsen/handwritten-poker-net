[project]
name = "poker-handnet"
version = "0.1.0"
description = "A hand-written (zero-gradient-descent) neural network for UCI Poker Hand classification, benchmarked against trained baselines."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1",
  "torch>=2.6",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "matplotlib>=3.9",
  "pytest>=8.3",
  "tqdm>=4.66",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_handnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
